# Compiles the car firmware on every push / pull request so a broken sketch is caught automatically.
name: Compile firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # secrets.h is gitignored, so a fresh checkout does not have it.
      # Copy the placeholder version so the sketches can compile.
      - name: Create secrets.h from the example files
        run: |
          for d in firmware/SchoolBus firmware/TelemetryLink; do
            cp "$d/secrets.example.h" "$d/secrets.h"
          done

      - uses: arduino/compile-sketches@v1
        with:
          # Same settings as Tools menu in the Arduino IDE (board: DFRobot Firebeetle 2 ESP32-S3).
          fqbn: fqbn: esp32:esp32:dfrobot_firebeetle2_esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=default
          platforms: |
            - name: esp32:esp32
              version: 3.3.7         
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            # Edge Impulse export (with the PSRAM patch) lives in the repo itself
            - source-path: firmware/libraries/a0912_inferencing
            - name: DFRobot_AXP313A
              version: 1.0.0
            - name: TinyGPSPlus
              version: 1.0.3
            - name: Adafruit_MCP23017_Arduino_Library
              version: 2.3.2
            - name: LiquidCrystal_I2C
              version: 2.0.0
            - name: IRremote
              version: 4.5.0
            - name: WebSockets
              version: 2.7.2
            - name: ArduinoJson
              version: 0.2.0
          sketch-paths: |
            - firmware/SchoolBus
            - firmware/TelemetryLink
